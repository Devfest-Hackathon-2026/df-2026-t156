    canvas { width:100%; height:100%; display:block; outline:0 }
    #load { position:absolute; inset:0; background:#141c1d url('../../assets/af1d7c8936ca024452f2e84043824a0414ca5bacaa3d9eebc84f4290fac77fab.jpg') center/cover no-repeat }

    progress { display:block; width:100%; height:2px; border:0; appearance:none; overflow:hidden; background:#ffffff26; color:#d0d8d0 }
    progress::-webkit-progress-bar { background:#ffffff26 }
    progress::-webkit-progress-value { background:#d0d8d0 }
    progress::-moz-progress-bar { background:#d0d8d0 }
    #error { white-space:pre-wrap; line-height:1.6; color:#f2b1a1; font-size:14px; overflow-wrap:anywhere }

    @media(max-width:520px) { .loading{left:24px;bottom:32px;width:calc(100% - 48px)}h1{font-size:25px} }

</head>
<body>
  <canvas id="unity-canvas" tabindex="0"></canvas>
  <div id="load">
    <div class="loading">
      <h1><img src="../../assets/5df659d8a608216b96750e66a1c65c67961580d16df676f036a0724f32dc54c9.png" alt="谷の採鉱競争"></h1>
      <p class="progress-label"><span id="load-label">読み込み中</span><span id="percent">0%</span></p>

    </div>
  </div>
  <script src="../../runtime/history-bridge.js" data-version="r22"></script><script>
    const canvas = document.getElementById('unity-canvas');


    function resizeRenderBuffer() {
      const width = canvas.clientWidth || 1280;
      const height = canvas.clientHeight || 720;
      document.documentElement.style.setProperty("--ui-scale", Math.min(width / 1000, height / 680));
      const ratio = Math.min(1, 1920 / width, Math.sqrt((1920 * 1080) / (width * height)));
      const targetWidth = Math.max(1, Math.round(width * ratio));
      const targetHeight = Math.max(1, Math.round(height * ratio));
      if (canvas.width !== targetWidth) canvas.width = targetWidth;
      if (canvas.height !== targetHeight) canvas.height = targetHeight;
    }
    new ResizeObserver(resizeRenderBuffer).observe(canvas);
    resizeRenderBuffer();

    const config = {
      dataUrl: window.historyAssetUrls["2e4bbe98acde1e3aa909304dc08de7b6c37e788ccef83d38e36310293c8c8f43.data"],
      frameworkUrl: '../../assets/a9d276f423afce966467a85e2a4c84b86fae383a22493a2f41b124faa79c5c67.js',
      codeUrl: window.historyAssetUrls["5608de60dd745512b48f56646415b5fb15bc504ff53877c8fc6c2841e004877a.wasm"],
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Pichu',
      productName: '谷の採鉱競争',
      productVersion: '0.2',
      matchWebGLToCanvasSize: false,
      showBanner(message, type) {
        if (type === 'error') document.getElementById('error').textContent = message;
      }
    };
    const loader = document.createElement('script');
    loader.src = '../../assets/8c7a9e4b2538dab3353b31f3894d51b38781580a059cbae2a67c6ca092fa7bf2.js';
    loader.onload = () => {
      createUnityInstance(canvas, config, value => {
        document.getElementById('progress').value = value;
        document.getElementById('percent').textContent = Math.round(value * 100) + '%';
      }).then(instance => {
        window.orbitUnity = instance;
        document.getElementById('load').style.display = 'none';

        canvas.focus();
      }).catch(error => {
        document.getElementById('error').textContent = '読み込めませんでした。ページを再読み込みしてください。\n' + error;
      });
    };
    document.body.appendChild(loader);
  </script>

</html>
